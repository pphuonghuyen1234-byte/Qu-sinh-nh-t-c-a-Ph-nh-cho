<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một món quà đang chờ cậu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbeee9;--ink:#3b1f2b;--muted:#7a5563;--rose:#e0607e;--rose2:#c44566;--gold:#f2b84b;--cream:#fff4e6;--leaf:#4f8a5b;--chip:rgba(59,31,43,.09);--chipOn:#3b1f2b;--chipOnInk:#fff4e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
[hidden]{display:none!important}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;text-align:center}
h1,h2{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;margin:0;line-height:1.2}
h1{font-size:clamp(26px,7vw,40px);max-width:16ch}
h2{font-size:clamp(24px,6vw,32px)}
p{margin:0}
#hint{color:var(--muted);min-height:1.5em}
#stage{width:min(78vw,300px)}
svg{display:block;width:100%;height:auto;overflow:visible}
#box{all:unset;display:block;width:100%;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
#box:focus-visible,.seg button:focus-visible,#blow:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:10px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
#lid{transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .6s .1s}
.open #box{animation:none}
.open #lid{transform:translateY(-120px) rotate(-14deg);opacity:0}
.open #base{transition:transform .5s .35s,opacity .4s .4s;transform:translateY(24px) scale(.92);opacity:0}
.pop{animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.5) translateY(30px);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.flame:nth-of-type(2){animation-delay:.15s}.flame:nth-of-type(3){animation-delay:.3s}
@keyframes flick{to{transform:scale(.88,1.12) rotate(4deg)}}
.out .flame{opacity:0;transform:scale(.2);animation:none}
.bl{transform:scale(0)}
.on .bl{animation:bloom .7s cubic-bezier(.2,1.4,.4,1) var(--d) forwards}
@keyframes bloom{to{transform:scale(1)}}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--chip);border-radius:999px}
.seg button,#blow{font:inherit;font-weight:500;border:0;cursor:pointer;padding:10px 20px;border-radius:999px;background:transparent;color:var(--ink);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk)}
#blow{background:var(--rose);color:#fff;padding:12px 28px}
#blow:disabled{opacity:.5;cursor:default}
#card{max-width:30ch;display:grid;gap:8px;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
#card p{color:var(--muted)}
#controls{display:flex;flex-direction:column;align-items:center;gap:12px}
.cf{position:fixed;top:-16px;width:8px;height:14px;border-radius:2px;pointer-events:none;z-index:20;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
html{background:var(--bg)}
body{background:transparent}

      <div id="tul" class="pop" hidden>
        <svg id="tsvg" viewBox="0 0 240 280" role="img" aria-label="Bó hoa tulip đang nở"></svg>
      </div>
      <div id="bouq" class="pop" hidden>
        <svg id="bsvg" viewBox="0 0 240 280" role="img" aria-label="Bó hoa cẩm tú cầu đang nở"></svg>
      </div>
    </div>
  </div>

  <div id="controls" hidden>
    <div class="seg" role="group" aria-label="Chọn món quà">
      <button type="button" data-m="cake" aria-pressed="true">Bánh kem</button>
      <button type="button" data-m="bouquet" aria-pressed="false">Cẩm tú cầu</button>
      <button type="button" data-m="tulip" aria-pressed="false">Tulip</button>
    </div>
    <button id="blow" type="button">Thổi nến</button>
  </div>

  <div id="card" hidden>
    <h2 id="wish">Chúc mừng sinh nhật!</h2>
    <p>Cảm ơn Phanh vì đã đến bên, mua vui và làm những trò con bò với tuiiii, chúc Phanh khoẻ như toro, trẻ như alicu, hạnh phúc và giàu sangg</p>
  </div>
</main>

<script>
(function(){
  var name='Phanh Phanh dấu iu';
  try{var hn=decodeURIComponent(location.hash.slice(1)).replace(/[-_+]/g,' ').trim().slice(0,30);if(hn)name=hn;}catch(e){}
  var $=function(id){return document.getElementById(id)};
  if(name){$('title').textContent=name+' ơi, có quà cho cậu';$('wish').textContent='Chúc mừng sinh nhật, '+name+'!';}

  var HY=[
    {x:66,y:112,R:31,n:24,p:['#b08ad8','#cdb2ee','#9468c8','#dccaf5']},
    {x:174,y:112,R:31,n:24,p:['#f0a6c4','#f8c9dc','#e384ab','#fbdde8']},
    {x:120,y:72,R:36,n:30,p:['#7aa5e8','#a9c4f2','#5b86d6','#c8d8f7']},
    {x:120,y:124,R:28,n:20,p:['#9fbdf0','#c8d8f7','#7aa5e8','#dde8fb']}
  ];
  var s='<g stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round">';
  HY.forEach(function(h){s+='<path d="M120 255 Q'+((120+h.x)/2)+' 195 '+h.x+' '+h.y+'"/>';});
  s+='</g><g fill="var(--leaf)"><ellipse cx="44" cy="160" rx="26" ry="11" transform="rotate(-30 44 160)"/><ellipse cx="196" cy="160" rx="26" ry="11" transform="rotate(30 196 160)"/><ellipse cx="82" cy="172" rx="20" ry="8" transform="rotate(-50 82 172)"/><ellipse cx="158" cy="172" rx="20" ry="8" transform="rotate(50 158 172)"/></g>';
  HY.forEach(function(h,k){
    var g='<g class="bl" style="--d:'+(k*200)+'ms;transform-origin:'+h.x+'px '+h.y+'px">',r=h.R*.27;
    for(var i=h.n-1;i>=0;i--){
      var rr=h.R*.86*Math.sqrt((i+.5)/h.n),th=i*2.39996,x=(h.x+rr*Math.cos(th)).toFixed(1),y=(h.y+rr*Math.sin(th)).toFixed(1);
      g+='<g transform="translate('+x+' '+y+') rotate('+((i*37)%90)+')" fill="'+h.p[i%h.p.length]+'">';
      for(var j=0;j<4;j++)g+='<ellipse cx="0" cy="'+(-r*.55).toFixed(2)+'" rx="'+(r*.5).toFixed(2)+'" ry="'+(r*.62).toFixed(2)+'" transform="rotate('+(90*j)+')"/>';
      g+='<circle r="'+(r*.2).toFixed(2)+'" fill="#fff4e6"/></g>';
    }
    s+=g+'</g>';
  });
  s+='<path d="M58 170 L182 170 L138 272 L102 272 Z" fill="var(--rose2)"/><path d="M58 170 L182 170 L176 186 L64 186 Z" fill="var(--cream)" opacity=".9"/><circle cx="120" cy="200" r="9" fill="var(--gold)"/>';
  $('bsvg').innerHTML=s;

  var TU=[[68,100,22,'#f2b84b','#f8d27a'],[172,100,22,'#ff9e7d','#ffb89e'],[94,132,20,'#b78bd6','#cdb2ee'],[148,132,20,'#f6b8c8','#fbd3de'],[120,76,26,'#e0607e','#f08aa3']];
  var ts='<g stroke="var(--leaf)" stroke-width="4" fill="none" stroke-linecap="round">';
  TU.forEach(function(t){ts+='<path d="M120 255 Q'+((120+t[0])/2)+' 195 '+t[0]+' '+t[1]+'"/>';});
  ts+='</g><g fill="var(--leaf)"><path d="M120 258C74 236 42 196 36 148C82 172 112 206 120 258Z"/><path d="M120 258C166 236 198 196 204 148C158 172 128 206 120 258Z"/></g>';
  TU.forEach(function(t,i){
    var x=t[0],y=t[1],s=t[2],f=function(a,b){return (x+a*s).toFixed(1)+' '+(y+b*s).toFixed(1)};
    ts+='<g class="bl" style="--d:'+(i*200)+'ms;transform-origin:'+x+'px '+y+'px"><path fill="'+t[3]+'" d="M'+f(0,0)+'C'+f(-1.1,0)+' '+f(-1.15,-.7)+' '+f(-.95,-1.5)+'L'+f(-.5,-1.05)+'L'+f(0,-1.6)+'L'+f(.5,-1.05)+'L'+f(.95,-1.5)+'C'+f(1.15,-.7)+' '+f(1.1,0)+' '+f(0,0)+'Z"/><path fill="'+t[4]+'" d="M'+f(0,0)+'C'+f(-.6,-.1)+' '+f(-.65,-.8)+' '+f(-.45,-1.1)+'L'+f(0,-1.6)+'L'+f(.45,-1.1)+'C'+f(.65,-.8)+' '+f(.6,-.1)+' '+f(0,0)+'Z"/></g>';
  });
  ts+='<path d="M58 170 L182 170 L138 272 L102 272 Z" fill="var(--rose2)"/><path d="M58 170 L182 170 L176 186 L64 186 Z" fill="var(--cream)" opacity=".9"/><circle cx="120" cy="200" r="9" fill="var(--gold)"/>';
  $('tsvg').innerHTML=ts;

  var mode='cake',opened=false;
  function confetti(){
    if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    var cols=['#e0607e','#f2b84b','#ff9e7d','#b78bd6','#4f8a5b','#fff4e6'],els=[];
    for(var i=0;i<46;i++){
      var e=document.createElement('i');e.className='cf';
      e.style.left=(Math.random()*100)+'vw';e.style.background=cols[i%cols.length];
      e.style.setProperty('--x',((Math.random()-.5)*160)+'px');
      e.style.setProperty('--t',(2.2+Math.random()*2)+'s');
      e.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(e);els.push(e);
    }
    setTimeout(function(){els.forEach(function(e){e.remove()})},5000);
  }
  function celebrate(){$('card').hidden=false;confetti();$('card').scrollIntoView({behavior:'smooth',block:'nearest'});}
  function show(m){
    mode=m;
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===m)});
    $('cake').hidden=m!=='cake';$('bouq').hidden=m!=='bouquet';$('tul').hidden=m!=='tulip';
    $('blow').hidden=m!=='cake';$('blow').disabled=false;
    $('cake').classList.remove('out');$('bouq').classList.remove('on');$('tul').classList.remove('on');
    $('card').hidden=true;
    if(m==='cake'){$('hint').textContent='Ước một điều, rồi thổi nến nhé';}
    else{
      $('hint').textContent=m==='tulip'?'Một bó tulip vừa nở dành cho cậu':'Một bó cẩm tú cầu vừa nở dành cho cậu';
      var el=m==='tulip'?$('tul'):$('bouq');void el.offsetWidth;el.classList.add('on');
      setTimeout(function(){if(mode===m)celebrate()},1800);
    }
  }
  var audio=null,playing=false;
var SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function buildWav(){
  var sr=32000,beat=.5,total=0;
  SONG.forEach(function(n){total+=n[1]*beat});
  var len=Math.floor((total+1.4)*sr),buf=new Float32Array(len),t=0;
  var hs=[[1,.6],[2,.22],[3,.08],[4,.03]];
  SONG.forEach(function(n){
    var f=n[0],d=n[1]*beat,st=Math.floor(t*sr),L=Math.min(len-st,Math.floor((d+.9)*sr));
    for(var i=0;i<L;i++){
      var x=i/sr,env=Math.min(1,x/.008)*Math.exp(-x*3);
      var v=0;for(var k=0;k<hs.length;k++)v+=hs[k][1]*Math.sin(6.283185307*f*hs[k][0]*x);
      v+=.25*Math.sin(3.141592654*f*x);
      buf[st+i]+=v*env;
    }
    t+=d;
  });
  var pk=0,i;for(i=0;i<len;i++){var a=Math.abs(buf[i]);if(a>pk)pk=a;}
  var g=pk?0.8/pk:1,dv=new DataView(new ArrayBuffer(44+len*2));
  function w(o,str){for(var j=0;j<str.length;j++)dv.setUint8(o+j,str.charCodeAt(j));}
  w(0,'RIFF');dv.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,len*2,true);
  for(i=0;i<len;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,buf[i]*g))*32767,true);
  return URL.createObjectURL(new Blob([dv],{type:'audio/wav'}));
}
function label(){$('music').textContent=playing?'Tắt nhạc':'Bật nhạc';$('music').setAttribute('aria-label',$('music').textContent);}
function startMusic(){
  try{
    if(!audio){audio=new Audio(buildWav());audio.loop=true;audio.volume=.8;audio.preload='auto';}
    audio.currentTime=0;
    var p=audio.play();
    playing=true;$('music').hidden=false;label();
    if(p&&p.catch)p.catch(function(){playing=false;label();});
  }catch(e){playing=false;$('music').hidden=false;label();}
}
function stopMusic(){if(audio)audio.pause();playing=false;label();}
$('music').addEventListener('click',function(){playing?stopMusic():startMusic();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&playing&&audio)audio.pause();else if(!document.hidden&&playing&&audio)audio.play().catch(function(){});});
$('box').addEventListener('click',function(){
    if(opened)return;opened=true;startMusic();
    document.body.classList.add('open');
    setTimeout(function(){$('box').hidden=true;$('reveal').hidden=false;$('controls').hidden=false;show(mode);},850);
  });
  document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){if(b.dataset.m!==mode)show(b.dataset.m)})});
  $('blow').addEventListener('click',function(){
    $('cake').classList.add('out');$('blow').disabled=true;setTimeout(celebrate,500);
  });
})();
</script>
</body>
</html>
